<!doctype html><html><head><meta charset="utf-8"><title>Kirka — Энергетика 3D (пример)</title><meta name="robots" content="noindex">
<style>
:root{--bg:#0E0F10;--panel:#15171A;--panel2:#1B1E22;--line:#262A2F;--line2:#30353B;--tx:#D9DBDD;--mut:#8A9096;--faint:#5C6268;--acc:#4F98A3;--ok:#5FB878;--warn:#E0A33A;--bad:#E0525A}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px Inter,'Segoe UI',system-ui,sans-serif;overflow:hidden}
.num{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:22px;height:48px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}.logo i{width:24px;height:24px;border-radius:5px;background:var(--acc)}
.tab{color:var(--mut)}.tab.on{color:var(--tx);border-bottom:2px solid var(--acc);padding:14px 0}
.bar{position:absolute;top:60px;left:18px;right:18px;display:flex;gap:8px;align-items:center;z-index:5}
.st{padding:7px 12px;border:1px solid var(--line2);border-radius:6px;color:var(--mut);background:var(--panel);cursor:pointer}.st.on{color:var(--tx);border-color:var(--acc);background:rgba(79,152,163,.13)}
.sp{flex:1}.seg{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;background:var(--panel)}.seg b{padding:6px 12px;font-weight:500;color:var(--mut);cursor:pointer}.seg b.on{background:rgba(79,152,163,.13);color:var(--tx)}
#cv{position:absolute;inset:0}
.lb{pointer-events:auto;font-size:11px;line-height:1.25;background:rgba(21,23,26,.88);border:1px solid var(--line2);border-radius:5px;padding:3px 6px;white-space:nowrap;cursor:pointer}
.lb b{font-weight:700}.lb .m{color:var(--mut)}.lb .pl{display:inline-block;margin-left:4px;padding:0 4px;border-radius:3px;font:600 9px/14px ui-monospace,monospace;background:#2a2f35;color:#cfd3d6}
.lb.sm{padding:1px 4px;font-size:10px}.lb.sm .pl{margin-left:3px;font-size:8px;line-height:12px}.lb.big{font-size:12px;padding:5px 8px}.lb.f{border-width:1px 1px 1px 3px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.panel{position:absolute;right:18px;top:104px;width:270px;background:rgba(21,23,26,.94);border:1px solid var(--line);border-radius:8px;padding:12px 14px;z-index:5}
.panel h3{margin:0 0 8px;font-size:13px}.r{display:flex;justify-content:space-between;padding:3px 0;color:var(--mut)}.r b{color:var(--tx);font:500 12px ui-monospace,monospace}
.fl{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--line)}.fl:first-of-type{border-top:0}.fl i{width:18px;height:4px;border-radius:2px}
.fl .n{flex:1}.fl .v{font:500 12px ui-monospace,monospace}
.hint{position:absolute;left:18px;bottom:14px;color:var(--faint);font-size:12px;z-index:5}
.legend{position:absolute;left:18px;bottom:40px;display:flex;gap:14px;color:var(--mut);font-size:12px;z-index:5;background:rgba(21,23,26,.85);padding:6px 10px;border-radius:6px;border:1px solid var(--line)}
</style>
</head><body>
<div id="cv"></div>
<div class="top"><span class="logo"><i></i>Kirka</span><span class="tab">Обзор</span><span class="tab">Контейнеры</span><span class="tab">Асики</span><span class="tab on">Энергетика</span><span class="tab">Проблемы</span><span class="tab">Клиенты</span><span class="tab">Пулы</span></div>
<div class="bar"><span class="st on">Карта объекта</span><span class="st">Счётчики</span><span class="st">Почасовки</span><span class="st">Фазы</span><span class="st">Фото и ввод</span><span class="st">Конструктор</span>
<span class="sp"></span><span style="color:var(--mut)">Подсветка:</span><div class="seg" id="hl"><b data-f="" class="on">Все фидеры</b><b data-f="0">Ф-6</b><b data-f="1">Ф-76</b><b data-f="2">Ф-75</b></div>
<span style="color:var(--mut)">Слой:</span><div class="seg" id="ly"><b data-l="st" class="on">Статус</b><b data-l="pl">Разъёмы</b><b data-l="ld">Нагрузка</b></div>
<div class="seg"><b>2D</b><b class="on">3D</b></div></div>
<div class="panel" id="pn"></div>
<div class="legend" id="lg"></div>
<div class="hint">Мышь: вращать · колесо: масштаб · правая кнопка: сдвиг · клик по КТП или фидеру — подсветить ветку</div>
<script type="module" src="/demo/energy3d.js?v=1"></script></body></html>
