<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kirka — ферма</title>
<meta name="theme-color" content="#0E0F10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2301696F'/%3E%3Cpath d='M9 23 16 9l7 14M12 18h8' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/farm.css?v=7">
</head>
<body>
<div id="login" class="login" hidden>
  <div class="lg-card">
    <div class="lg-logo"><svg viewBox="0 0 32 32" width="40" height="40" aria-label="Kirka"><rect width="32" height="32" rx="7" fill="var(--acc)"/><path d="M9 23 16 9l7 14M12 18h8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Kirka</span></div>
    <h1>Вход через Telegram</h1>
    <p class="mut">Отсканируйте код телефоном или нажмите кнопку — бот спросит подтверждение.</p>
    <div id="qrbox" class="qrbox"><div class="spin"></div></div>
    <a id="tglink" class="btn pri wide" target="_blank" rel="noopener">Открыть @kirkalabbot</a>
    <p id="lgmsg" class="mut small"></p>
  </div>
</div>

<div id="app" class="app" hidden>
  <header class="top">
    <a class="logo" href="#today" aria-label="Kirka"><svg viewBox="0 0 32 32" width="26" height="26"><rect width="32" height="32" rx="7" fill="var(--acc)"/><path d="M9 23 16 9l7 14M12 18h8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Kirka</span></a>
    <nav class="tabs" aria-label="Разделы">
      <button class="tab on" data-page="today">Обзор</button>
      <button class="tab" data-page="map">Контейнеры</button>
      <button class="tab" data-page="asics">Асики</button>
      <button class="tab" data-page="errors">Проблемы <b id="errBadge" class="badge" hidden></b></button>
      <button class="tab" data-page="clients">Клиенты</button>
      <button class="tab" data-page="pools">Пулы</button>
    </nav>
    <div class="gsearch"><svg viewBox="0 0 24 24" width="15" height="15"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="gq" type="search" placeholder="Найти асик: IP, воркер, серийный, место…" autocomplete="off" aria-label="Поиск"><div id="gqRes" class="gres" hidden></div></div>
    <div class="auto" title="Данные обновляются сами раз в минуту"><i></i><span id="syncAt">—</span></div>
    <a class="ib" href="/calc.html" title="Калькулятор"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M12 12h2M8 16h2M12 16h2"/></svg></a>
    <button class="ib" id="themeBtn" title="Светлая / тёмная тема"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg></button>
    <button class="ib" id="logoutBtn" title="Выйти"><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></button>
    <div class="av" id="av">K</div>
  </header>
  <div class="phead">
    <button class="btn ghost back" id="backBtn" hidden title="Вернуться на предыдущую страницу">← Назад</button>
    <h1 id="pageTitle">Обзор</h1>
    <div id="siteSel" class="msel" aria-label="Площадки"></div>
    <div id="clientSel" class="msel" aria-label="Клиенты"></div>
    <span class="sp"></span>
    <div id="pageAside" class="aside"></div>
  </div>
  <main class="main" id="main"></main>
</div>

<div id="selbar" class="selbar" hidden>
  <span class="sn"><b id="selN">0</b> выбрано</span>
  <button class="btn" data-act="list">Показать списком</button>
  <button class="btn" data-act="export">Выгрузить в Excel</button>
  <button class="btn" data-act="workers">Скопировать воркеры</button>
  <button class="btn" data-act="copy">Скопировать IP</button>
  <button class="btn" data-act="compare">Сравнить</button>
  <button class="btn ghost" data-act="clear">Снять выбор</button>
</div>

<div id="drawer" class="drawer" hidden><div class="dr-in" id="drIn"></div></div>
<div id="modal" class="modal" hidden><div class="md-in" id="mdIn"></div></div>
<input type="file" id="poolFile" accept=".xlsx" hidden>
<div id="toast" class="toast" hidden></div>
<div id="tip" class="tip2" hidden></div>

<script src="/vendor/qrcode.min.js"></script>
<script src="/farm.js?v=7"></script>
</body>
</html>
